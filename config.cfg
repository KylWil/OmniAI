# Selects characters for gameplay
# Available character options: GARNET, ZEN, LUD, NEZ

character_one=GARNETT
character_two=GARNET

# WARNING: Changing any values below this line can break the program

# Loop control parameters
# Default values and descriptions
# n_steps = 2048 : Buffer limit before clearing and triggering training loop
# checkpoint_every = 10 : Number of buffer clears before agent checkpoint creation
# minibatch_size = 256 : Batch size taken from buffer for loop to update network with
# k_epochs = 4 : Number of times learning loop reuses minibatch before discarding

n_steps=2048
checkpoint_every=10
minibatch_size=256
k_epochs=4

# Learning hyperparameters
# Default values and descriptions
# lr = 3e-4 : Adam optimizer learning rate
# gamma = 0.99 : Discount factor for calculating advantage
# lam = 0.95 : Lambda value for calculating advantage
# clip = 0.2 : PPO clip function epsilon value. Controls how far the network can vary from the previous policy
# entropy_coef = 0.01 : Entropy bonus modifier
# value_coef = 0.5 : Value loss modifier
# max_grad_norm = 0.5 : Maximum gradient clipping

lr=3e-4
gamma=0.99
lam=0.95
clip=0.2
entropy_coef=0.01
value_coef=0.5
max_grad_norm=0.5